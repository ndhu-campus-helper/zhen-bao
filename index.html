<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍寶線上點餐系統</title>
    <style>
        /* 🎨 藍色系文青風核心配色 */
        :root {
            --bg-color: #f4f7f9;        /* 輕柔的文青霧灰藍底 */
            --primary-dark: #1d3557;   /* 深普魯士藍（標題、主按鈕） */
            --accent-blue: #457b9d;    /* 莫蘭迪藍（價格、副標題） */
            --light-blue: #a8dadc;     /* 淡粉藍（跑馬燈背景、點綴） */
            --text-main: #2b3a4a;      /* 深藍灰字體（高質感文字） */
            --card-shadow: 0 8px 20px rgba(29, 53, 87, 0.04); /* 空氣感微陰影 */
        }

        body { 
            font-family: "PingFang TC", "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
            scroll-behavior: smooth; /* 平滑滾動 */
        }

        header { 
            background-color: var(--primary-dark); 
            color: white; 
            text-align: center; 
            padding: 35px 0 25px 0; 
            position: relative;
        }
        
        header h1 { 
            margin: 0; 
            font-size: 1.8rem; 
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* 🍔 手機版漢堡按鈕 (預設隱藏) */
        .menu-toggle {
            display: none;
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 1001;
        }

        /* 🏷️ 質感跑馬燈設計 */
        .marquee-container {
            background-color: #eaf4f4;
            color: var(--primary-dark);
            padding: 8px 0;
            font-size: 0.95rem;
            font-weight: 500;
            border-bottom: 1px solid var(--light-blue);
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .marquee-label {
            background-color: var(--accent-blue);
            color: white;
            padding: 2px 10px;
            margin-left: 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            white-space: nowrap;
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        marquee {
            margin-left: 10px;
        }

        /* 📦 三欄式版面佈局 */
        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px; 
            display: flex; 
            gap: 25px; 
        }

        /* 🧭 左側分類導覽列 */
        .category-sidebar {
            width: 180px;
            flex-shrink: 0;
            background: white;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(69, 123, 157, 0.08);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .category-sidebar h4 {
            margin: 0 0 15px 0;
            color: var(--primary-dark);
            font-size: 1.1rem;
            border-bottom: 2px solid var(--light-blue);
            padding-bottom: 8px;
        }

        .category-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: none;
            border: none;
            border-radius: 6px;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .category-btn:hover {
            background-color: #f0f4f8;
            color: var(--accent-blue);
            padding-left: 18px;
        }

        /* 中央菜單區 */
        .menu-section { 
            flex: 2; 
            min-width: 320px; 
        }

        .category-block {
            margin-bottom: 40px;
            scroll-margin-top: 20px; /* 滾動對齊留白 */
        }

        .menu-title { 
            border-left: 4px solid var(--accent-blue); 
            padding-left: 12px; 
            margin: 0 0 20px 0; 
            color: var(--primary-dark);
            font-size: 1.35rem;
            font-weight: 600;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
        }

        /* 🍔 商品卡片 UI */
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: var(--card-shadow); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(69, 123, 157, 0.08);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(29, 53, 87, 0.08);
        }

        .card h4 { 
            margin: 0 0 10px 0; 
            font-size: 1.15rem; 
            color: var(--primary-dark);
        }

        .card .price { 
            color: var(--accent-blue); 
            font-weight: bold; 
            font-size: 1.1rem;
            margin-bottom: 20px; 
        }

        .card button { 
            background-color: var(--primary-dark); 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s;
        }

        .card button:hover {
            background-color: var(--accent-blue);
        }

        /* 🛒 右側購物車 UI */
        .cart-section { 
            width: 320px;
            flex-shrink: 0;
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: var(--card-shadow); 
            height: fit-content; 
            border: 1px solid rgba(69, 123, 157, 0.08);
            position: sticky;
            top: 20px;
        }

        .cart-section h3 {
            margin-top: 0;
            color: var(--primary-dark);
            font-size: 1.25rem;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 10px;
        }

        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid #f0f4f8; 
        }

        .cart-item strong {
            color: var(--primary-dark);
        }

        .cart-item button { 
            background: #e63946; 
            color: white; 
            border: none; 
            padding: 4px 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 0.85rem;
        }

        .total-price { 
            text-align: right; 
            font-size: 1.3rem; 
            font-weight: bold; 
            margin: 20px 0; 
            color: var(--accent-blue); 
        }

        hr {
            border: 0;
            height: 1px;
            background: #edf2f7;
            margin: 25px 0;
        }

        /* 📋 填寫欄位 UI */
        form label { 
            display: block; 
            margin-top: 15px; 
            font-weight: 500; 
            font-size: 0.95rem;
            color: var(--primary-dark);
        }

        form input, form select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 6px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        form input:focus, form select:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: white;
        }

        .submit-btn { 
            background-color: var(--accent-blue); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            margin-top: 25px; 
            border-radius: 6px; 
            font-size: 1.05rem; 
            cursor: pointer; 
            font-weight: bold; 
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .submit-btn:hover { 
            background-color: var(--primary-dark); 
        }

        .submit-btn:disabled { 
            background-color: #cbd5e1; 
            color: #94a3b8;
            cursor: not-allowed; 
        }

        /* 📱 響應式網頁設計 (RWD) 斷點設定 */
        @media (max-width: 992px) {
            .container {
                flex-direction: column;
                padding: 0 15px;
            }

            /* 漢堡按鈕現身 */
            .menu-toggle {
                display: block;
            }

            /* 左側側邊欄在手機版變成彈出式抽屜 */
            .category-sidebar {
                position: fixed;
                top: 0;
                left: -220px; /* 預設藏在左邊外面 */
                width: 200px;
                height: 100vh;
                z-index: 1000;
                border-radius: 0;
                transition: left 0.3s ease;
                box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            }

            /* 當啟動 .active 時滑入畫面 */
            .category-sidebar.active {
                left: 0;
            }

            /* 手機版遮罩層 */
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0,0,0,0.4);
                z-index: 999;
            }

            .sidebar-overlay.active {
                display: block;
            }

            .menu-section, .cart-section {
                width: 100%;
                box-sizing: border-box;
            }
            
            .cart-section {
                position: static;
            }
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h1>珍寶線上點餐系統</h1>
    </header>

    <div class="marquee-container">
        <span class="marquee-label">本日簡餐配菜</span>
        <marquee behavior="scroll" direction="left" scrollamount="5">
            手工香酥馬鈴薯泥、清炒高鈣花椰菜、黃金玉米炒蛋。每日新鮮現作，營養均衡！
        </marquee>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="container">
        <nav class="category-sidebar" id="categorySidebar">
            <h4>商品分類</h4>
            <div id="categoryList">
                </div>
        </nav>

        <div class="menu-section" id="menuSectionsContainer">
            </div>

        <div class="cart-section">
            <h3>🛒 您的購物車</h3>
            <div id="cartItems">
                <p style="color: #888; font-size: 0.95rem;">購物車是空的，快去選購吧！</p>
            </div>
            <div class="total-price">總計: NT$ <span id="totalAmount">0</span></div>
            
            <hr>
            
            <h3>📋 訂購人資訊</h3>
            <form id="orderForm">
                <label for="custName">真實姓名：</label>
                <input type="text" id="custName" placeholder="請輸入您的姓名" required>

                <label for="custPhone">聯絡電話（核對與異常通知）：</label>
                <input type="tel" id="custPhone" placeholder="例如：0912345678" required>

                <label for="pickupTime">預計取餐時間：</label>
                <select id="pickupTime" required>
                    <option value="">請選擇取餐時間...</option>
                    <option value="12:00">12:00</option>
                    <option value="12:15">12:15</option>
                    <option value="12:30">12:30</option>
                </select>
                <button type="submit" class="submit-btn" id="submitBtn" disabled>確認送出點餐</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby9MAsImUPHMAM3t4QdszaXcdl4n2wKjR_zZozHkpuGTbqai1cXZzT3UUsi-LSihPgz/exec";

        // 🌟 已為你擴充品項並分類 (可自由增刪，網頁會自動同步)
        const menuProducts = [
            { id: 1, name: "手工高麗菜水餃", price: 60, category: "水餃系列" },
            { id: 2, name: "招牌韭菜水餃", price: 60, category: "水餃系列" },
            { id: 3, name: "經典卡拉雞腿堡", price: 65, category: "美味漢堡" },
            { id: 4, name: "原味蛋餅", price: 30, category: "美味漢堡" },
            { id: 5, name: "脆皮薯條", price: 35, category: "精選炸物" },
            { id: 6, name: "酥炸雞塊(6塊)", price: 45, category: "精選炸物" },
            { id: 7, name: "招牌大冰奶", price: 25, category: "嚴選飲料" },
            { id: 8, name: "沁涼冰紅茶", price: 20, category: "嚴選飲料" }
        ];

        let cart = [];

        // 🍔 控制手機版漢堡選單開關
        function toggleSidebar() {
            document.getElementById('categorySidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // 🔄 自動渲染分類按鈕與分區商品列表
        function initMenu() {
            // 1. 萃取所有不重複的分類
            const categories = [...new Set(menuProducts.map(p => p.category))];
            
            // 2. 渲染左側導覽按鈕
            const categoryList = document.getElementById('categoryList');
            categoryList.innerHTML = categories.map(cat => `
                <button class="category-btn" onclick="scrollToCategory('${cat}')">${cat}</button>
            `).join('');

            // 3. 按分類分組渲染商品
            const container = document.getElementById('menuSectionsContainer');
            container.innerHTML = categories.map(cat => {
                const filteredProducts = menuProducts.filter(p => p.category === cat);
                return `
                    <div class="category-block" id="cat-${cat}">
                        <h3 class="menu-title">${cat}</h3>
                        <div class="grid">
                            ${filteredProducts.map(product => `
                                <div class="card">
                                    <h4>${product.name}</h4>
                                    <div class="price">NT$ ${product.price}</div>
                                    <button onclick="addToCart(${product.id})">加入購物車</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ✈️ 點擊分類平滑錨點滾動
        function scrollToCategory(catId) {
            const target = document.getElementById(`cat-${catId}`);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
            // 如果是在手機版，點選完後自動收回選單
            if (window.innerWidth <= 992) {
                toggleSidebar();
            }
        }

        function addToCart(productId) {
            const product = menuProducts.find(p => p.id === productId);
            const existItem = cart.find(item => item.id === productId);
            if (existItem) { existItem.quantity += 1; } else { cart.push({ ...product, quantity: 1 }); }
            updateCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const totalAmountSpan = document.getElementById('totalAmount');
            const submitBtn = document.getElementById('submitBtn');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = `<p style="color: #888; font-size: 0.95rem;">購物車是空的，快去選購吧！</p>`;
                totalAmountSpan.innerText = "0";
                submitBtn.disabled = true;
                return;
            }

            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div><strong>${item.name}</strong><br><small style="color:#64748b;">NT$ ${item.price} x ${item.quantity}</small></div>
                    <button onclick="removeFromCart(${item.id})">刪除</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            totalAmountSpan.innerText = total;
            submitBtn.disabled = false;
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "訂單送出中...";

            const itemSummary = cart.map(item => `${item.name}x${item.quantity}`).join(', ');

            const orderData = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                time: document.getElementById('pickupTime').value,
                items: itemSummary,
                total: document.getElementById('totalAmount').innerText
            };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === "success") {
                    alert("🎉 點餐成功！店家已收到您的餐點預約。");
                    document.getElementById('orderForm').reset();
                    cart = [];
                    updateCart();
                } else {
                    alert("❌ 點餐失敗：" + result.message);
                }
            })
            .catch(err => {
                alert("❌ 系統連線發生錯誤，請稍後再試。");
                console.error(err);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "確認送出點餐";
            });
        });

        // 初始化菜單
        initMenu();
    </script>
</body>
</html>
